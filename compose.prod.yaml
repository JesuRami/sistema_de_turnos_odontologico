# Producción: reinicio, límites y logs (single cloud deploy por tenant — fase 1).
# C-14: la app y el worker corren con el usuario de `app_writer`; `migrate` con el dueño.
# Backups cifrados con PITR: docs/piloto/backups-pitr.md (pgBackRest, fuera de este archivo).
services:
  migrate:
    environment:
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD es obligatoria en prod}

  api:
    restart: always
    # nginx (frontend) es la única puerta: la API no se publica en el host, así que
    # solo contenedores propios le hablan y puede confiar en su `X-Forwarded-For`
    # (uvicorn 0.30 no admite CIDR; sin esto todos compartirían la IP del proxy
    # en los rate-limits de login y reserva).
    ports: !reset []
    environment:
      FORWARDED_ALLOW_IPS: "*"
      # C-15 (D7): volumen `clinical_files` heredado de compose.yaml (respaldo: docs/clinica/).
      CLINICAL_STORAGE_ROOT: /data/clinical_files
      # C-14 (D7): en prod la clave del usuario de la app es obligatoria (sin default de ejemplo).
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-turnos_app}:${APP_DB_PASSWORD:?APP_DB_PASSWORD es obligatoria en prod}@db:5432/turnos
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-turnos_app}:${APP_DB_PASSWORD:?APP_DB_PASSWORD es obligatoria en prod}@db:5432/turnos
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
