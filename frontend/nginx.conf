server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # DNS de Docker: `api` se resuelve en cada request (sobrevive a reinicios del contenedor
  # y nginx arranca aunque la API todavía no esté arriba).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  # C-14 (D1): headers seguros de la SPA. `style-src-attr 'unsafe-inline'` solo para los atributos
  # `style` de la grilla de agenda; nunca scripts inline.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  server_tokens off;

  # API de dominio (C-03+): se reenvía tal cual, con el prefijo `/api`.
  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    # nginx es el borde: se SOBRESCRIBE (no se encadena) para que el cliente no pueda
    # falsear su IP; los rate-limits de la API dependen de este valor.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Salud de infraestructura, fuera de `/api`.
  location = /health {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
  }

  # SPA: rutas /b/:slug y /g/:token resuelven a index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
