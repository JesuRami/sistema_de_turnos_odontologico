[project]
name = "sistema-turnos-odontologico"
version = "0.1.0"
description = "Sistema de turnos odontológico — MVP agenda-first (C-01 foundation)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<0.117",
  "uvicorn[standard]>=0.29,<0.31",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.29,<0.33",
  "alembic>=1.13,<1.14",
  "redis>=5.0,<6.0",
  "arq>=0.26,<0.27",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "python-jose[cryptography]>=3.3,<4.0",
  "passlib[argon2]>=1.7,<2.0",
  "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<0.24",
  "ruff>=0.4,<0.5",
  "black>=24.0,<25.0",
  "mypy>=1.10,<1.11",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.alembic]
script_location = "backend/alembic"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
