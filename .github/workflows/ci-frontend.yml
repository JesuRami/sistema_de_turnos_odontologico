name: frontend

on:
  push:
    paths: ["frontend/**"]
  pull_request:
    paths: ["frontend/**"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar
        working-directory: frontend
        run: npm ci
      - name: Typecheck estricto
        working-directory: frontend
        run: npm run typecheck
      - name: Tests unitarios y de componentes (Vitest)
        working-directory: frontend
        run: npm run test
      - name: Build Vite
        working-directory: frontend
        run: npm run build
# C-14: el E2E con Playwright corre en .github/workflows/ci-e2e.yml contra el stack real.
