# Base Compose: api + db (Postgres 15 pineado) + redis (7 pineado) + worker + frontend.
# Tags pineados + healthchecks + depends_on con condición (regla dura 12).
# Redes: `backend` interna (db/redis) + `frontend` (api↔frontend).
# Dev: compose.override.yaml (hot-reload). Prod: compose.prod.yaml.

services:
  db:
    image: postgres:15.8-bookworm
    environment:
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: turnos
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://turnos:${DB_PASSWORD:-changeme}@db:5432/turnos
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/ready')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.app.worker.entrypoint"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://turnos:${DB_PASSWORD:-changeme}@db:5432/turnos
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import asyncio,os,redis.asyncio as r;print(asyncio.run(r.from_url(os.environ['REDIS_URL']).ping()))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:80/ | grep -q Agenda"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  backend:
    internal: true
  frontend:

volumes:
  pgdata:
  redis-data:
