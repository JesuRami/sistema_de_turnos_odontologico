# Override de desarrollo: hot-reload (bind-mounts solo en dev).
services:
  migrate:
    # Dev: migra y siembra la clínica demo (idempotente por slug; con reserva pública
    # habilitada solo al crearla). Monta `backend/` para aplicar migraciones nuevas sin rebuild.
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    environment:
      SEED_BOOKING_DEMO: "true"
      SEED_DEMO_USERS: "true"
    volumes:
      - ./backend:/srv/app/backend:ro
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/srv/app/backend:ro
  worker:
    volumes:
      - ./backend:/srv/app/backend:ro
  frontend:
    build:
      target: dev
    environment:
      # El proxy de Vite corre dentro del contenedor: el backend es el servicio `api`.
      API_PROXY_TARGET: http://api:8000
    volumes:
      # Hot-reload: código y config montados; `node_modules` queda el de la imagen.
      - ./frontend/src:/srv/web/src:ro
      - ./frontend/index.html:/srv/web/index.html:ro
      - ./frontend/vite.config.ts:/srv/web/vite.config.ts:ro
    # En dev este contenedor corre Vite (5173), no nginx (80): se reemplaza el mapeo
    # base 5173:80 en vez de sumarse, para no publicar un puerto muerto.
    ports: !override
      - "5174:5173"
    healthcheck:
      # En dev corre Vite (5173), no nginx (80): el healthcheck base no aplica.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
