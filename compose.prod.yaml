# Producción: reinicio, límites y logs (single cloud deploy por tenant — fase 1).
services:
  api:
    restart: always
    # nginx (frontend) es la única puerta: la API no se publica en el host, así que
    # solo contenedores propios le hablan y puede confiar en su `X-Forwarded-For`
    # (uvicorn 0.30 no admite CIDR; sin esto todos compartirían la IP del proxy
    # en los rate-limits de login y reserva).
    ports: !reset []
    environment:
      FORWARDED_ALLOW_IPS: "*"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
